server.port=8083
server.address=0.0.0.0

spring.application.name=ITEM-SERVICE

# MongoDB
spring.data.mongodb.uri=mongodb://10.10.0.2:27017/lost-and-found-microservice
spring.data.mongodb.database=lost-and-found-microservice

gcs.bucket-name=lost-and-found-505717-images
gcs.project-id=lost-and-found-505717

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Eureka
eureka.client.service-url.defaultZone=http://10.10.0.10:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Lease settings (optional but good)
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Config Server disabled ? the third-party config-server repo's ITEM-SERVICE profile
# has a stale mongodb://localhost:27017 value that overrides this file's MongoDB URI
# (spring.config.import always takes priority over local properties, so
# spring.cloud.config.override-none does not help here). Keeping this service fully
# self-contained avoids the conflict.
#spring.config.import=optional:configserver:http://10.10.0.10:8000