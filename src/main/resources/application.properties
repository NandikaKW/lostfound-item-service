server.port=8083
server.address=0.0.0.0

spring.application.name=ITEM-SERVICE

# MongoDB Configuration - Use correct property names
spring.data.mongodb.host=10.10.0.2
spring.data.mongodb.port=27017
spring.data.mongodb.database=lost-and-found-microservice

# Alternative: Use connection string with correct property name
# spring.data.mongodb.uri=mongodb://10.10.0.2:27017/lost-and-found-microservice

gcs.bucket-name=lost-and-found-505717-images
gcs.project-id=lost-and-found-505717

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Eureka
eureka.client.service-url.defaultZone=http://10.10.0.10:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Lease settings
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Disable Config Server completely
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Logging for debugging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.mongodb=DEBUG